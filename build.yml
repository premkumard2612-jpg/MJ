name: Build MJ APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create MJ project files
        run: |
          mkdir -p app/src/main/java/com/boss/mj
          cat > settings.gradle.kts <<'EOF_MJ'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MJ"
          include(":app")
          EOF_MJ
          cat > build.gradle.kts <<'EOF_MJ'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_MJ
          cat > gradle.properties <<'EOF_MJ'
          org.gradle.jvmargs=-Xmx2g
          kotlin.code.style=official
          EOF_MJ
          cat > app/build.gradle.kts <<'EOF_MJ'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.boss.mj"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.boss.mj"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_MJ
          cat > app/src/main/AndroidManifest.xml <<'EOF_MJ'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="MJ"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MJService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF_MJ
          cat > app/src/main/java/com/boss/mj/MainActivity.kt <<'EOF_MJ'
          package com.boss.mj

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var keyBox: EditText
              private lateinit var nameBox: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("mj", Context.MODE_PRIVATE)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad * 2, pad, pad)

                  val title = TextView(this)
                  title.text = "MJ - Personal Assistant"
                  title.textSize = 24f
                  root.addView(title)

                  val info = TextView(this)
                  info.text = "Steps: 1) Key aur naam bharo  2) Overlay permission do  3) Battery restriction hatao  4) START dabao. Phir bolo: MJ, YouTube kholo"
                  info.setPadding(0, pad / 2, 0, pad / 2)
                  root.addView(info)

                  keyBox = EditText(this)
                  keyBox.hint = "Gemini API key paste karo"
                  keyBox.setSingleLine(true)
                  keyBox.setText(prefs.getString("key", ""))
                  root.addView(keyBox)

                  nameBox = EditText(this)
                  nameBox.hint = "MJ aapko kya bulaye (sir / boss)"
                  nameBox.setSingleLine(true)
                  nameBox.setText(prefs.getString("call", "boss"))
                  root.addView(nameBox)

                  addButton(root, "Overlay permission do") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
                  addButton(root, "Battery restriction hatao") {
                      try {
                          startActivity(
                              Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      }
                  }
                  addButton(root, "MJ START") { startMJ() }
                  addButton(root, "MJ STOP") {
                      stopService(Intent(this, MJService::class.java))
                      Toast.makeText(this, "MJ band ho gaya", Toast.LENGTH_SHORT).show()
                  }

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              private fun addButton(root: LinearLayout, label: String, action: () -> Unit) {
                  val b = Button(this)
                  b.text = label
                  b.setOnClickListener { action() }
                  root.addView(b)
              }

              private fun startMJ() {
                  getSharedPreferences("mj", Context.MODE_PRIVATE).edit()
                      .putString("key", keyBox.text.toString().trim())
                      .putString("call", nameBox.text.toString().trim().ifEmpty { "boss" })
                      .apply()

                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      need.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      need.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (need.isNotEmpty()) {
                      requestPermissions(need.toTypedArray(), 11)
                      return
                  }
                  startForegroundService(Intent(this, MJService::class.java))
                  Toast.makeText(this, "MJ chalu ho gaya. Ab MJ bolo", Toast.LENGTH_LONG).show()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  Toast.makeText(this, "Permission ke baad dobara START dabao", Toast.LENGTH_LONG).show()
              }
          }
          EOF_MJ
          cat > app/src/main/java/com/boss/mj/MJService.kt <<'EOF_MJ'
          package com.boss.mj

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          class MJService : Service(), TextToSpeech.OnInitListener {

              companion object {
                  // Agar Gemini model ka naam badle to sirf yahan change karna
                  const val MODEL = "gemini-flash-latest"
                  val WAKE_WORDS = listOf("mj", "m j", "em jay", "emjay", "em j", "एमजे", "एम जे", "ऍमजे")
                  val ALIASES = mapOf(
                      "व्हाट्सएप" to "whatsapp", "व्हाट्सऐप" to "whatsapp", "व्हाट्सअप" to "whatsapp",
                      "वॉट्सऐप" to "whatsapp", "यूट्यूब" to "youtube", "इंस्टाग्राम" to "instagram",
                      "क्रोम" to "chrome", "कैमरा" to "camera", "सेटिंग्स" to "settings", "सेटिंग" to "settings",
                      "फेसबुक" to "facebook", "जीमेल" to "gmail", "टेलीग्राम" to "telegram",
                      "कैलकुलेटर" to "calculator", "फोन" to "phone", "गैलरी" to "gallery",
                      "मैप्स" to "maps", "गूगल मैप्स" to "maps", "स्पॉटिफाई" to "spotify"
                  )
              }

              private val main = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var speaking = false
              private var busy = false
              private var listening = false
              private var running = true
              private var stopAfterSpeech = false
              private var awakeAt = 0L
              private var wakeLock: PowerManager.WakeLock? = null
              private var apiKey = ""
              private var callName = "boss"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  loadPrefs()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("mj", "MJ", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "mj:listen")
                  wakeLock?.acquire()
                  tts = TextToSpeech(this, this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  loadPrefs()
                  return START_STICKY
              }

              private fun loadPrefs() {
                  val p = getSharedPreferences("mj", MODE_PRIVATE)
                  apiKey = p.getString("key", "") ?: ""
                  callName = p.getString("call", "boss") ?: "boss"
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, "mj")
                      .setContentTitle("MJ sun raha hai")
                      .setContentText("MJ bolo, $callName")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      listen()
                      return
                  }
                  val r = tts?.setLanguage(Locale("hi", "IN"))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts?.setLanguage(Locale.getDefault())
                  }
                  tts?.setSpeechRate(1.05f)
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) { afterSpeech() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) { afterSpeech() }
                  })
                  ttsReady = true
                  speak("MJ taiyaar hai $callName")
              }

              private fun afterSpeech() {
                  main.post {
                      speaking = false
                      if (stopAfterSpeech) {
                          stopSelf()
                      } else {
                          listen()
                      }
                  }
              }

              private fun speak(text: String) {
                  if (!ttsReady) {
                      listen()
                      return
                  }
                  main.post {
                      speaking = true
                      try { recognizer?.cancel() } catch (e: Exception) {}
                      listening = false
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "mj")
                  }
              }

              private fun listen() {
                  main.post {
                      if (!running || speaking || busy || listening) return@post
                      try {
                          if (recognizer == null) {
                              recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                              recognizer?.setRecognitionListener(listener)
                          }
                          val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                          listening = true
                          recognizer?.startListening(i)
                      } catch (e: Exception) {
                          listening = false
                          main.postDelayed({ listen() }, 1000)
                      }
                  }
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onError(error: Int) {
                      listening = false
                      if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                          speak("Mic ki permission chahiye")
                          return
                      }
                      val delay = if (error == SpeechRecognizer.ERROR_NO_MATCH ||
                          error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT) 150L else 1000L
                      main.postDelayed({ listen() }, delay)
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                      val text = list?.firstOrNull()
                      if (!text.isNullOrBlank()) handle(text)
                      listen()
                  }
              }

              private fun stripWake(t: String): String? {
                  val s = " " + t.lowercase().replace(Regex("[.,!?]"), " ").replace(Regex("\\s+"), " ") + " "
                  for (w in WAKE_WORDS) {
                      val idx = s.indexOf(" $w ")
                      if (idx >= 0) return s.substring(idx + w.length + 2).trim()
                  }
                  return null
              }

              private fun handle(text: String) {
                  val cmd: String
                  val stillAwake = System.currentTimeMillis() - awakeAt < 10000
                  val stripped = stripWake(text)
                  if (stripped != null) {
                      if (stripped.isEmpty()) {
                          awakeAt = System.currentTimeMillis()
                          speak("Ji $callName")
                          return
                      }
                      cmd = stripped
                  } else if (stillAwake) {
                      awakeAt = 0L
                      cmd = text.trim()
                  } else {
                      return
                  }
                  process(cmd)
              }

              private fun process(cmd: String) {
                  val c = cmd.lowercase().trim()

                  if (c.contains("band ho jao") || c.contains("stop listening") || c.contains("बंद हो जाओ")) {
                      stopAfterSpeech = true
                      speak("Theek hai $callName, band ho raha hoon")
                      return
                  }

                  val appName = extractAppName(c)
                  if (appName != null) {
                      val ok = openApp(appName)
                      speak(if (ok) "Ji $callName, $appName khol diya" else "$appName mujhe nahi mila")
                      return
                  }

                  busy = true
                  Thread {
                      val answer = askGemini(cmd)
                      main.post {
                          busy = false
                          speak(answer)
                      }
                  }.start()
              }

              private fun extractAppName(c: String): String? {
                  val patterns = listOf(
                      Regex("^(?:open|launch|start|ओपन|खोलो)\\s+(.+)$"),
                      Regex("^(.+?)\\s+(?:kholo|khol do|khol de|open karo|open kar do|chalu karo|chalu kar do|start karo|खोलो|खोल दो|ओपन करो|चालू करो)$")
                  )
                  for (p in patterns) {
                      val m = p.find(c)
                      if (m != null) {
                          var name = m.groupValues[1].trim()
                          for ((k, v) in ALIASES) name = name.replace(k, v)
                          return name.trim()
                      }
                  }
                  return null
              }

              private fun openApp(name: String): Boolean {
                  return try {
                      val pm = packageManager
                      val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val apps = pm.queryIntentActivities(q, 0)
                      val hit = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == name }
                          ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(name) }
                          ?: return false
                      val launch = pm.getLaunchIntentForPackage(hit.activityInfo.packageName) ?: return false
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(launch)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun askGemini(q: String): String {
                  if (apiKey.isBlank()) return "Pehle app me Gemini API key daalo"
                  return try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 20000
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("x-goog-api-key", apiKey)
                      conn.doOutput = true

                      val sys = "You are MJ, a fast personal voice assistant. Address the user as '$callName'. " +
                          "Reply in short spoken Hindi (Devanagari script) mixing common English words in English letters. " +
                          "Maximum 2 short sentences. No markdown, no emojis, no lists."
                      val body = JSONObject()
                          .put("system_instruction", JSONObject().put("parts",
                              JSONArray().put(JSONObject().put("text", sys))))
                          .put("contents", JSONArray().put(JSONObject()
                              .put("role", "user")
                              .put("parts", JSONArray().put(JSONObject().put("text", q)))))

                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val resp = stream.bufferedReader().use { it.readText() }
                      if (code !in 200..299) return "Gemini me error aaya, code $code"

                      val parts = JSONObject(resp)
                          .getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts")
                      val sb = StringBuilder()
                      for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                      sb.toString().replace("*", "").replace("#", "").trim().ifEmpty { "Mujhe jawab nahi mila" }
                  } catch (e: Exception) {
                      "Internet ya API me dikkat hai"
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { recognizer?.destroy() } catch (e: Exception) {}
                  tts?.stop()
                  tts?.shutdown()
                  try { wakeLock?.release() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF_MJ
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mj-latest
          name: MJ APK (latest)
          files: app/build/outputs/apk/debug/app-debug.apk
